# Only if the server runs Apache instead of nginx. Needs: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName iwcd-shifts.hyperk.ca
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/iwcd-shifts.hyperk.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/iwcd-shifts.hyperk.ca/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8010/
    ProxyPassReverse / http://127.0.0.1:8010/
</VirtualHost>
